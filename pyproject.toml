[project]
name = "scientific-eval"
version = "0.1.0"
description = "Multi-pass scientific paper correctness review against OpenAI-compatible LLM endpoints (LM Studio, OpenRouter)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60.0",
    "pymupdf>=1.24.0",
    "pyspellchecker>=0.8.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.10.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
hunspell = ["spylls>=0.1.7"]

[project.scripts]
scieval = "scieval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "respx>=0.21.1",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",     # typer and fastapi both declare defaults by calling into the framework
    "SIM108",   # an if/else is often clearer than a ternary here
    "UP042",    # (str, Enum) is deliberate: it serialises identically everywhere
    "UP045",    # typer reads Optional[X] annotations most reliably
    "RUF001",   # the prompts and reports contain intentional typographic characters
]

[tool.ruff.lint.per-file-ignores]
# The CLI declares one long Annotated option per line; wrapping them hurts more
# than the length does.
"src/scieval/cli.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
