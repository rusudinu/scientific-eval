[project]
name = "scientific-eval"
version = "0.1.0"
description = "Multi-pass scientific paper correctness review against OpenAI-compatible LLM endpoints (LM Studio, OpenRouter)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.60.0",
    "pymupdf>=1.24.0",
    "pyspellchecker>=0.8.1",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.15.0",
    "rich>=13.9.0",
    "httpx>=0.27.0",
    "rapidfuzz>=3.10.0",
]

[project.optional-dependencies]
hunspell = ["spylls>=0.1.7"]

[project.scripts]
scieval = "scieval.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "respx>=0.21.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scieval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
